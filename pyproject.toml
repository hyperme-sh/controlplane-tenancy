[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-tenancy"
version = "0.14.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@1f7ad10396797a1ff9ff9f95eda3f5597585e775", "sqlalchemy>=2.0.43"]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_tenancy"]



[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "src", "tests", "scripts", "README.md", "AGENTS.md", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
